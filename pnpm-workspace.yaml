packages:
  - "apps/*"

autoInstallPeers: true
strictPeerDependencies: false
preferWorkspacePackages: true
linkWorkspacePackages: true

# A dependency that declares it cannot run on our Node must stop the install, not print a warning CI ignores.
engineStrict: true

# Supply-chain gates (civfix/issue-tracker#259 D11). A version must be a day old before it can resolve, so a
# hijacked publish is usually caught and pulled first. @civfix/* is exempt: it is our own registry, and a fresh
# contract or tokens publish has to be adoptable the same day.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@civfix/*"
# Refuse a version published with weaker provenance than the versions before it (a stolen token, not CI).
trustPolicy: no-downgrade
# A git or tarball-URL subdependency carries no publish time or provenance, so it would slip past both checks above.
blockExoticSubdeps: true
# A new install script must stop the install for review: skipped silently, it can also break a native binary unnoticed.
strictDepBuilds: true

# The only packages allowed to run install scripts. All three are postinstalls that verify, and if needed fetch,
# the native binary their platform package provides: esbuild (vite under vitest, and wrangler), unrs-resolver
# (eslint-import-resolver-typescript) and workerd (wrangler, the deploy tool). Add a package here only after
# reading its script.
allowBuilds:
  esbuild: true
  unrs-resolver: true
  workerd: true

# Floors for transitive packages whose parent still declares a vulnerable range, each bounded inside the
# vulnerable package's own major so the fix stays a patch/minor for the requester: vite (vitest peer), js-yaml 4,
# brace-expansion 1/5, nanoid 3, postcss, browserslist, postcss-selector-parser 6/7 and source-map-js 1 (eslint,
# tailwindcss 3, next and vitest DoS and path-traversal advisories); sharp (next still accepts the vulnerable 0.34
# line); undici 7 (wrangler pins it through miniflare). Drop each entry once its parent ships the fixed range itself.
overrides:
  vite: ">=7.3.7 <8"
  js-yaml@4: ">=4.3.1 <5"
  brace-expansion@1: ">=1.1.21 <2"
  brace-expansion@5: ">=5.0.12 <6"
  nanoid@3: ">=3.3.18 <4"
  postcss: ">=8.5.28 <9"
  browserslist: ">=4.28.9 <5"
  postcss-selector-parser@6: ">=6.1.5 <7"
  source-map-js@1: ">=1.2.2 <2"
  sharp: ">=0.35.5 <0.36"
  undici@7: ">=7.30.1 <8"
  postcss-selector-parser@7: ">=7.1.6 <8"
