name: CI

# main is the only long-lived branch and the only PR target (issue civfix/issue-tracker#108).
#
# `dev` is listed ONLY for the duration of the lane cutover, so the cutover PR into `dev` gets CI at all
# — a `pull_request` trigger is evaluated from the merge commit, so a `[main]`-only list means a PR into
# `dev` runs nothing. (That was already the case here before the cutover, which is why a PR into `dev`
# in this repo historically ran no CI.) Drop `dev` in the same change that deletes the branch.
on:
  pull_request:
    branches: [main, dev]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint / typecheck / build / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test (unit)
        run: pnpm test
