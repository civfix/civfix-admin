name: CI

# main is the only long-lived branch (issue civfix/issue-tracker#108): main is the staging lane, and
# production ships from a published v* release. No base filter: a stacked PR targets its parent slice's
# branch and still needs CI before it retargets onto main.
on:
  pull_request:
  # main's merge queue waits for the required checks on its own gh-readonly-queue/* commit; without this
  # trigger they never report there and every queued PR times out.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit all dependencies (high and above)
        run: pnpm audit --audit-level high

      - name: Audit production dependencies (moderate and above)
        run: pnpm audit --prod --audit-level moderate

      - name: Production dependency licenses
        run: pnpm check:licenses

      - name: Test repo scripts
        run: pnpm test:scripts

      - name: Workflow security (zizmor)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.31.1
          persona: regular
          min-severity: medium
          online-audits: false
          advanced-security: false

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Unused files, exports and dependencies (knip)
        run: pnpm --filter admin knip

      - name: Duplication (jscpd)
        run: pnpm --filter admin dup

      - name: Typecheck
        run: pnpm typecheck

  app-build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  app-tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test (unit, coverage thresholds)
        run: pnpm test:coverage

  # The ruleset requires this name, so the split jobs stay invisible to the merge queue. A check GitHub
  # sees as skipped counts as passed, hence always() and the explicit test of every result.
  required:
    name: lint / typecheck / build / test
    runs-on: ubuntu-latest
    if: always()
    needs: [static, app-build, app-tests]
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::a required CI job finished as $result: $RESULTS"
              exit 1
            fi
          done
