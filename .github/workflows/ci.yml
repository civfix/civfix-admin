name: CI

# main is the only long-lived branch (issue civfix/issue-tracker#108): main is the staging lane, and
# production ships from a published v* release. No base filter: a stacked PR targets its parent slice's
# branch and still needs CI before it retargets onto main.
on:
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint / typecheck / build / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unused files, exports and dependencies (knip)
        run: pnpm --filter admin knip

      - name: Duplication (jscpd)
        run: pnpm --filter admin dup

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test (unit)
        run: pnpm test
