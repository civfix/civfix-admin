name: Deploy (Cloudflare Pages)

# Builds the civfix-admin static export and publishes it to its Cloudflare Pages project on every
# push to main, plus on-demand via the Actions "Run workflow" button. One app ships from this repo:
#   - admin -> Pages project "civfix-admin" (apps/admin/out, repo-root wrangler.jsonc) -> admin.civfix.org
#
# Required GitHub configuration (Settings -> Secrets and variables -> Actions):
#
#   Secrets:
#     CLOUDFLARE_API_TOKEN    Cloudflare API token with the "Cloudflare Pages: Edit" permission.
#     CLOUDFLARE_ACCOUNT_ID   The Cloudflare account id that owns the Pages project.
#     SUBMODULE_READ_TOKEN    A token with READ access to BOTH civfix-admin and the private civfix-shared
#                             repo, so actions/checkout can clone the shared/ submodule. A fine-grained
#                             PAT (Contents: Read on both repos) or a GitHub App installation token. The
#                             default GITHUB_TOKEN cannot do this (scoped to civfix-admin only).
#
#   Variables (vars.*), inlined into the static export at BUILD time (NEXT_PUBLIC_*):
#     NEXT_PUBLIC_API_URL     Base URL of the civfix API (e.g. https://api.civfix.example). The admin
#                             dashboard is served at admin.civfix.org and talks to this API. The API's
#                             WEB_ORIGINS must include https://admin.civfix.org for CORS + cookies.
#
# The project name + prebuilt output directory come from wrangler.jsonc, so the deploy step is just
# `pages deploy` (no args). The project is created automatically by the first run. We use Direct Upload
# (build here, ship the prebuilt out/) rather than Cloudflare's native Git build because the
# @civfix/shared submodule is private with a relative URL, which native Pages builds cannot reliably
# clone; this job checks it out with credentials (submodules: recursive). SPA deep links and
# security/cache headers are handled by the app's public/{_redirects,_headers} (copied into out/).

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy per ref at a time; do not cancel an in-flight publish.
concurrency:
  group: deploy-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: build + publish civfix-admin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          # The @civfix/shared contract is a git submodule (shared/) living in a SEPARATE private repo
          # (github.com/civfix/civfix-shared). The default GITHUB_TOKEN is scoped to this repo only and
          # cannot clone it (GitHub returns "Repository not found"), so we check out with
          # SUBMODULE_READ_TOKEN - a token with read access to BOTH civfix-admin and civfix-shared.
          submodules: recursive
          token: ${{ secrets.SUBMODULE_READ_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Persist the build caches between runs. Side-effect-free: Turbo validates every task by an input
      # hash that already includes the NEXT_PUBLIC_* vars, so a changed API URL or source file rebuilds.
      - name: Restore Turbo + Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/admin/.next/cache
          key: ${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Build static export
        # NEXT_PUBLIC_* values are inlined into the export here at build time.
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: pnpm build

      - name: Publish civfix-admin to Cloudflare Pages
        # `pnpm dlx` fetches wrangler OUTSIDE the workspace (no root mutation). The project name +
        # output dir are read from the repo-root wrangler.jsonc.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@3 pages deploy
