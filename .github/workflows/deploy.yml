name: Deploy (Cloudflare Pages)

# Builds the civfix-admin static export and publishes it to its Cloudflare Pages project on every
# push to main, plus on-demand via the Actions "Run workflow" button. One app ships from this repo:
#   - admin -> Pages project "civfix-admin" (apps/admin/out, repo-root wrangler.jsonc) -> admin.civfix.org
#
# Required GitHub configuration (Settings -> Secrets and variables -> Actions):
#
#   Secrets:
#     CLOUDFLARE_API_TOKEN    Cloudflare API token with the "Cloudflare Pages: Edit" permission.
#     CLOUDFLARE_ACCOUNT_ID   The Cloudflare account id that owns the Pages project.
#
#   Variables (vars.*), inlined into the static export at BUILD time (NEXT_PUBLIC_*):
#     NEXT_PUBLIC_API_URL        Leave unset: both environments call the API same-origin (see below).
#                                Setting it points the build at a cross-origin API instead.
#     NEXT_PUBLIC_CARTO_API_KEY  Optional publishable CARTO key for the basemap tiles.
#
# The project name + prebuilt output directory come from wrangler.jsonc, so the deploy step is just
# `pages deploy` (no args). The project is created automatically by the first run. We use Direct Upload
# (build here, ship the prebuilt out/) rather than Cloudflare's native Git build; @civfix/shared installs
# from the public-read private registry via the committed .npmrc.
# SPA deep links and security/cache headers are handled by the app's public/{_redirects,_headers}
# (copied into out/).

# Ref -> environment (issue https://github.com/civfix/issue-tracker/issues/108):
#   push to main       -> STAGING    --branch=staging -> staging.civfix-admin.pages.dev -> admin.civfix.dev
#                         (via the civfix-infra staging Caddy, which reverse-proxies the SPA to that
#                         alias: env/staging.sh ADMIN_SPA_UPSTREAM)
#   published v* tag   -> PRODUCTION --branch=main    -> civfix-admin.pages.dev          -> admin.civfix.org
#
# There is no `dev` branch: feature branches PR into main, main IS the staging lane, and cutting a
# release promotes to production. The admin app talks to its API same-origin (/v1/admin/* proxied by
# Caddy), so NEXT_PUBLIC_API_URL is unset for BOTH environments and the two builds differ only in which
# Pages alias they land on. Production is still rebuilt from the release tag rather than byte-promoted,
# so it stays consistent with the web app, whose builds genuinely do differ per environment.
on:
  push:
    branches: [main]
  release:
    # `released`, NOT `published`: `published` also fires for a PRERELEASE, and a prerelease must never
    # reach admin.civfix.org, the operator plane. The regex gate below is the second guard.
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

# One deploy per ref at a time; do not cancel an in-flight publish.
concurrency:
  group: deploy-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: build + publish civfix-admin
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENV: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    steps:
      - name: Refuse a deploy from any ref but main or a v* release tag
        # The Pages branch below decides production-vs-preview, so the set of refs that can reach it has
        # to be closed explicitly rather than left to the trigger list.
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main | refs/tags/v*) ;;
            *)
              echo "::error::deploy.yml may only run on main or a v* tag; refusing '$GITHUB_REF'."
              exit 1
              ;;
          esac
          echo "ref $GITHUB_REF -> $DEPLOY_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the production gate below proves the tag is an ancestor of main.
          fetch-depth: 0

      - name: Prove the production ref (tag shape + merged into main)
        # THIS IS A BRANCH-PROTECTION CONTROL. Without it, pushing a tag on any commit deploys the
        # OPERATOR PLANE at admin.civfix.org, bypassing main's reviewed-PR requirement entirely. Keep
        # the regex identical to civfix-backend's deploy.yml and CIVFIX_RELEASE_TAG_REGEX in civfix-infra.
        if: env.DEPLOY_ENV == 'production'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          RELEASE_RE='^v[0-9]+\.[0-9]+\.[0-9]+$'
          if ! printf '%s' "$tag" | grep -qE "$RELEASE_RE"; then
            echo "::error::'$tag' is not a vMAJOR.MINOR.PATCH release tag; refusing to deploy production."
            echo "::error::Prereleases are excluded by design."
            exit 1
          fi
          git fetch --quiet --force origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$tag" origin/main; then
            echo "::error::tag '$tag' is not merged into main. Production only ships code that went"
            echo "::error::through the staging lane and a reviewed PR. Refusing to deploy."
            exit 1
          fi
          echo "$tag is a release tag merged into main"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Persist the build caches between runs. Side-effect-free: Turbo validates every task by an input
      # hash that already includes the NEXT_PUBLIC_* vars, so a changed API URL or source file rebuilds.
      # The key is scoped by DEPLOY_ENV anyway: staging and production build the same commit, and
      # `.next/cache` is restored underneath Turbo, so the two must never share one. (Admin happens to
      # build identically in both environments today; this keeps that from becoming load-bearing.)
      - name: Restore Turbo + Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/admin/.next/cache
          key: ${{ runner.os }}-build-${{ env.DEPLOY_ENV }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.DEPLOY_ENV }}-

      - name: Build static export
        # NEXT_PUBLIC_* values are inlined into the export here at build time.
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_CARTO_API_KEY: ${{ vars.NEXT_PUBLIC_CARTO_API_KEY }}
        run: pnpm build

      - name: Publish civfix-admin to Cloudflare Pages
        # `pnpm dlx` fetches wrangler OUTSIDE the workspace (no root mutation). The project name +
        # output dir are read from the repo-root wrangler.jsonc.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deterministic prod-vs-preview: --branch=main lands production (civfix-admin.pages.dev),
          # --branch=staging lands the preview alias (staging.civfix-admin.pages.dev). Derived from
          # DEPLOY_ENV rather than from the ref name, so a tag can never be passed to Cloudflare as a
          # branch label. Passed via env (not inlined into run) per Actions injection-safety.
          DEPLOY_BRANCH: ${{ startsWith(github.ref, 'refs/tags/v') && 'main' || 'staging' }}
        run: |
          set -euo pipefail
          case "$DEPLOY_ENV:$DEPLOY_BRANCH" in
            production:main | staging:staging) ;;
            *)
              echo "::error::refusing to publish $DEPLOY_ENV to the '$DEPLOY_BRANCH' Pages branch."
              exit 1
              ;;
          esac
          pnpm dlx wrangler@3 pages deploy --branch="$DEPLOY_BRANCH"
